server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: coffeeshop-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coffeeshop}
    username: ${DB_USERNAME:coffeeshop}
    password: ${DB_PASSWORD:coffeeshop}
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      # Slightly above app.storage.max-image-size so the service can reply with a clear 413 itself
      max-file-size: 6MB
      max-request-size: 7MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  api:
    # Base URL prefixed to every REST controller (controllers map only "/carts", "/orders", ...)
    base-path: /api/v1
  storage:
    # Uploaded images are written here and served at {public-url}/products/<file>
    upload-dir: ${UPLOAD_DIR:./uploads}
    public-url: ${UPLOAD_PUBLIC_URL:http://localhost:8080/uploads}
    max-image-size: 5MB
  tax-rate: 0.00
  order-code-prefix: ACR
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
