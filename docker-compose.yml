services:
  postgres:
    image: postgres:16-alpine
    container_name: coffeeshop-postgres
    environment:
      POSTGRES_DB: coffeeshop
      POSTGRES_USER: coffeeshop
      POSTGRES_PASSWORD: coffeeshop
    ports:
      - "5432:5432"
    volumes:
      - coffeeshop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffeeshop -d coffeeshop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  coffeeshop-pgdata:
